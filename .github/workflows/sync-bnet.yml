name: Sync Battle.net data

# Scheduled nightly + manual maintainer dispatch ONLY. No push/pull_request
# triggers: the Blizzard client secret must never be reachable from a PR build.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      lookup_name:
        description: "Battle.net character name to look up (empty = full sync)"
        required: false
        type: string
        default: ""
      force:
        description: "Ignore cached Last-Modified timestamps and refetch everything"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-bnet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Inputs and secrets travel exclusively through env:, never interpolated
      # into the shell line, so neither can leak into logs or be shell-injected.
      - name: Run Battle.net sync
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          LOOKUP_NAME: ${{ github.event.inputs.lookup_name }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ -n "$LOOKUP_NAME" ]; then args+=(--lookup "$LOOKUP_NAME"); fi
          if [ "$FORCE_INPUT" = "true" ]; then args+=(--force); fi
          python3 tools/sync_bnet.py "${args[@]}"

      # Gate before publishing (security review H2/H4): the artifacts reach main
      # only if the deterministic checks pass — schema shape, href/iconUrl hosts,
      # secret scan, and the sync script's own guardrails. A non-zero exit here
      # fails the job, so the commit step below never runs on a poisoned or
      # mass-flipped artifact set.
      - name: Verify sync artifacts
        run: python3 .pi/scripts/verify_sync_artifacts.py

      - name: Commit updated artifacts
        run: |
          git config user.name "bnet-sync-bot"
          git config user.email "bnet-sync-bot@users.noreply.github.com"
          git add battle-net-map.json character-data.json
          if git diff --cached --quiet; then
            echo "No artifact changes; skipping commit."
            exit 0
          fi
          git commit -m "Sync Battle.net character data [skip ci]"
          git push
