name: Sync Battle.net data

# Scheduled nightly + manual maintainer dispatch ONLY. No push/pull_request
# triggers: the Blizzard client secret must never be reachable from a PR build.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      lookup_name:
        description: "Battle.net character name to look up (empty = full sync)"
        required: false
        type: string
        default: ""
      force:
        description: "Ignore cached Last-Modified timestamps and refetch everything"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-bnet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # A hung run must not hold the sync-bnet concurrency group (cancel-in-progress:
    # false) forever. 15 minutes is generous for a capped run at 0.25 s pacing plus
    # the offline tests and the artifact gate; a timeout fails the job, so the
    # commit step below never publishes a partial run.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Offline, stdlib-only, no secrets and no network: the security helpers
      # (allowlist, redactor, H4 floor, artifact schemas) are proven before any
      # credential-bearing step runs, so a regression fails the job early.
      - name: Unit tests
        run: python3 -m unittest discover -s tools -p "test_*"

      # Inputs and secrets travel exclusively through env:, never interpolated
      # into the shell line, so neither can leak into logs or be shell-injected.
      # Phase 2 entrypoint is the bnet package (tools/bnet/): PYTHONPATH points at
      # tools/ so `python3 -m bnet` resolves from the workspace root. The provenance
      # key triggeredBy is read from the runner's own GITHUB_EVENT_NAME/GITHUB_ACTOR.
      - name: Run Battle.net sync
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          LOOKUP_NAME: ${{ github.event.inputs.lookup_name }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          args=()
          if [ -n "$LOOKUP_NAME" ]; then args+=(--lookup "$LOOKUP_NAME"); fi
          if [ "$FORCE_INPUT" = "true" ]; then args+=(--force); fi
          PYTHONPATH=tools python3 -m bnet sync "${args[@]}"

      # Gate before publishing (security review H2/H4): the artifacts reach main
      # only if the deterministic checks pass — schema shape, href/iconUrl hosts,
      # secret scan, and the sync script's own guardrails. A non-zero exit here
      # fails the job, so the commit step below never runs on a poisoned or
      # mass-flipped artifact set.
      - name: Verify sync artifacts
        run: python3 .pi/scripts/verify_sync_artifacts.py

      - name: Commit updated artifacts
        run: |
          git config user.name "bnet-sync-bot"
          git config user.email "bnet-sync-bot@users.noreply.github.com"
          # Phase 5b adds the two static icon maps (data/class-icons.json,
          # data/profession-icons.json): the sync writes them after the pair lands,
          # and the verify step above has already schema-checked them.
          # Phase C adds data/characters.json: the sync is an approved ADDITIVE writer of
          # the roster (one pending row per Battle.net-visible guild member the tracker does
          # not list), and the auto-added rows must land in the same commit as the map and
          # sidecar rows written for those ids, or the next run's coverage gate
          # (set(map entries) == set(roster ids)) fails against the file that grew. The
          # verify step above is what proves the write appended only: same rows, same order,
          # no mutation, compared against git HEAD.
          git add data/characters.json data/battle-net-map.json data/character-data.json data/talent-trees.json data/class-icons.json data/profession-icons.json
          if git diff --cached --quiet; then
            echo "No artifact changes; skipping commit."
            exit 0
          fi
          git commit -m "Sync Battle.net character data [skip ci]"
          git push
