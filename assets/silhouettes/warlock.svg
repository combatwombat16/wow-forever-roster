<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/warlock.svg — Goblin-cursed human warlock hunched in a commanding
  crouch: left hand clutching a glowing soul shard at the chest, right arm clawed outward,
  horned hood bowed, cloak billowing and pooling on the ground around the feet.
  Same conventions as the roster files: solid #0a0a0a figure, warm layered backdrop,
  interior etching, glow accents — accents in deep void purple (etching #b07ad0,
  glow #c478e8, bright #e8c6ff), a magenta-shifted violet kept distinct from the
  mage's soft lavender. A voidwalker pet floats at the left, maw open toward its master.
-->
