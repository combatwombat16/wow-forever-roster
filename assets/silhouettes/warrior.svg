    <path stroke="none" d="M 294 390 L 322 394 L 320 402 L 294 398 Z"/>

    <!-- tattered loincloth: three strips -->
    <path stroke="none" d="M 234 398 C 230 424, 228 450, 234 472 C 242 482, 258 484, 266 474 C 272 450, 272 424, 268 398 C 256 404, 244 404, 234 398 Z"/>
    <path stroke="none" d="M 222 400 C 214 424, 210 446, 214 464 L 222 456 L 228 466 C 226 444, 228 420, 232 402 Z"/>
    <path stroke="none" d="M 280 398 C 288 420, 292 442, 288 460 L 280 452 L 274 462 C 276 442, 274 420, 270 400 Z"/>
