    <path stroke="none" d="M 194 402 L 172 384 L 202 396 Z"/>
    <path stroke="none" d="M 330 412 L 362 400 L 336 432 Z"/>
    <path stroke="none" d="M 322 400 L 344 382 L 314 394 Z"/>
