    <path d="M 104 304 L 118 480" fill="none" stroke="#0a0a0a" stroke-width="9" stroke-linecap="round"/>
    <!-- tattered banner cloth -->
    <path d="M 90 316 L 130 314 L 128 352 L 136 364 L 124 360 L 122 376 L 112 364
             L 104 374 L 100 360 L 92 368 L 94 348 Z"/>
  </g>

  <!-- ============ rage mist behind the legs ============ -->
