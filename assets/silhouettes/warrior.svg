<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/test-4.svg — High-ornate variant of test-3.svg.
  Same pose and silhouette base: orc warrior, wide aggressive stance, massive two-handed
  double-bit axe raised overhead, cape flaring behind, classic WoW style.
  Beyond test-3: horned war totem with tattered banner at the left, second spiked right
  pauldron, knuckle spikes, beaded fang necklace with tooth pendant, skull hip charm and
  chain rings, loincloth hem ring with bone charm, glowing blade runes, edge glint,
  spiked cape clasp, totem rim light, and cracked-ground detail.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Orc Warrior — Overhead Axe Cleave, high ornate (WoW style silhouette)</title>

  <defs>
    <!-- battle-worn chips bitten into the axe edge -->
    <mask id="edgeChips" maskUnits="userSpaceOnUse" x="-210" y="-170" width="500" height="340">
      <rect x="-210" y="-170" width="500" height="340" fill="#fff"/>
      <path d="M -142 -14 L -114 0 L -142 14 Z" fill="#000"/>
      <path d="M -116 60 L -94 73 L -116 86 Z" fill="#000"/>
    </mask>
  </defs>

  <!-- ============ backdrop ============ -->
  <rect width="512" height="512" fill="#1a1410"/>
  <circle cx="256" cy="255" r="198" fill="#2e2318"/>
  <circle cx="256" cy="255" r="152" fill="#3d2c1a"/>
  <!-- rune tick rings -->
  <circle cx="256" cy="255" r="176" fill="none" stroke="#c9762b" stroke-opacity="0.18" stroke-width="7" stroke-dasharray="3 24"/>
  <circle cx="256" cy="255" r="128" fill="none" stroke="#c9762b" stroke-opacity="0.12" stroke-width="5" stroke-dasharray="2 17"/>
  <!-- drifting embers -->
  <g fill="#c9762b">
    <circle cx="92" cy="64" r="3" fill-opacity="0.35"/>
    <circle cx="418" cy="92" r="2.4" fill-opacity="0.3"/>
    <circle cx="452" cy="180" r="3.2" fill-opacity="0.25"/>
    <circle cx="70" cy="330" r="2.6" fill-opacity="0.3"/>
    <circle cx="392" cy="52" r="2" fill-opacity="0.4"/>
    <circle cx="30" cy="220" r="2" fill-opacity="0.25"/>
    <circle cx="474" cy="270" r="2.2" fill-opacity="0.3"/>
    <circle cx="140" cy="44" r="2" fill-opacity="0.3"/>
    <circle cx="252" cy="26" r="1.8" fill-opacity="0.35"/>
    <circle cx="436" cy="414" r="2.4" fill-opacity="0.22"/>
    <circle cx="56" cy="148" r="1.8" fill-opacity="0.3"/>
    <circle cx="348" cy="302" r="2" fill-opacity="0.18"/>
  </g>
  <ellipse cx="256" cy="480" rx="210" ry="18" fill="#0d0a07"/>

  <!-- ============ horned war totem with tattered banner (behind the warrior) ============ -->
