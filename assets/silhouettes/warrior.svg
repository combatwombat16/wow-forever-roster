    <path stroke="none" d="M 190 262 C 202 244, 228 236, 250 242 C 242 250, 238 256, 236 262 C 220 268, 200 270, 190 262 Z"/>
    <path stroke="none" d="M 188 248 C 200 232, 226 226, 246 232 C 240 238, 236 242, 234 248 C 218 254, 198 256, 188 248 Z"/>
    <path stroke="none" d="M 202 232 L 184 206 L 214 226 Z"/>
    <path stroke="none" d="M 224 226 L 220 198 L 238 224 Z"/>
    <path stroke="none" d="M 244 226 L 252 200 L 256 226 Z"/>
    <circle cx="194" cy="258" r="4" stroke="none"/>
    <circle cx="212" cy="248" r="4" stroke="none"/>
    <circle cx="232" cy="242" r="4" stroke="none"/>

    <!-- smaller spiked right pauldron -->
    <path stroke="none" d="M 316 286 C 324 268, 346 262, 364 268 C 360 276, 358 284, 360 292 C 344 300, 324 296, 316 286 Z"/>
    <path stroke="none" d="M 344 266 L 374 252 L 358 274 Z"/>
    <circle cx="324" cy="284" r="3.5" stroke="none"/>
    <circle cx="342" cy="276" r="3.5" stroke="none"/>

    <!-- ================= HEAD ================= -->
    <ellipse cx="278" cy="230" rx="26" ry="24" stroke="none"/>
    <rect x="264" y="244" width="28" height="30" stroke="none"/>
