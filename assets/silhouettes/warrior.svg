      <path d="M 30 -12 L 30 12"/>
      <path d="M 38 -12 L 38 12"/>
      <path d="M 124 -12 L 124 12"/>
      <path d="M 132 -12 L 132 12"/>
      <path d="M 140 -12 L 140 12"/>
