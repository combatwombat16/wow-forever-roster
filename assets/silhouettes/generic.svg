<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/generic.svg — the gear paper doll's fallback body.

  One stylised humanoid in one accent colour (the site gold, at a low fill-opacity so the item
  sockets painted on top of it stay readable). There is deliberately no text, no race detail and
  no per-character variant here: Phase F of roster-ui-tasks.md owns bespoke per-character art, and
  it will land as separate files under assets/silhouettes/char/ rather than by editing this one.

  The canvas is 300x400 (3:4) with the figure spanning ~5% to ~95% of the height and centred on
  x=150, because app.css paints it with `background-size: contain` inside the fixed .wow-doll box
  and js/detail.js positions the item sockets by percentage of that same box (head at the top,
  feet at the bottom, hands at ~44%). A silhouette whose head or feet drift off that band would
  put the Head socket over empty air.

  The file is published to Pages by the explicit allow-list in .github/workflows/pages.yml;
  verify_sync_artifacts.py permits exactly `assets/silhouettes/*.svg` and nothing wider.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Character silhouette placeholder">
  <g fill="#d4af37" fill-opacity="0.16">
    <circle cx="150" cy="46" r="24"/>
    <rect x="141" y="64" width="18" height="18" rx="7"/>
    <path d="M108 84h84l14 26-10 78h-92l-10-78z"/>
    <rect x="76" y="92" width="20" height="118" rx="10" transform="rotate(8 86 92)"/>
    <rect x="204" y="92" width="20" height="118" rx="10" transform="rotate(-8 214 92)"/>
    <rect x="108" y="182" width="84" height="32" rx="10"/>
    <rect x="112" y="208" width="32" height="156" rx="14"/>
    <rect x="156" y="208" width="32" height="156" rx="14"/>
    <rect x="102" y="358" width="46" height="16" rx="8"/>
    <rect x="152" y="358" width="46" height="16" rx="8"/>
  </g>
</svg>
