<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/hunter.svg — Night Elf hunter, lithe profile stance, longbow drawn to
  full anchor. Built in the same conventions as warrior.svg / paladin.svg: solid #0a0a0a
  figure, warm layered backdrop, interior etching, glow accents — accents shifted to
  jade greens with a silvermoon halo for the Night Elf identity.
  Pose: facing left in profile. Extended bow hand grips a tall recurve longbow at full
  draw, string running back past the ear to the trailing hook hand; arrow nocked, point
  crossing ahead of the bow. Forward (left) leg stepping with the knee bent, rear leg
  trailing. Quiver slung on the back with fletchings rising over the right shoulder,
  cloak lifting and tearing to the wind at the right, hair streaming behind.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Night Elf Hunter — Full-Draw Longbow, Profile Stride (WoW style silhouette)</title>

  <!-- ============ backdrop ============ -->
  <rect width="512" height="512" fill="#1a1410"/>
  <circle cx="256" cy="255" r="198" fill="#2e2318"/>
  <circle cx="256" cy="255" r="152" fill="#3d2c1a"/>
  <!-- rune tick rings -->
  <circle cx="256" cy="255" r="176" fill="none" stroke="#7fae6a" stroke-opacity="0.18" stroke-width="7" stroke-dasharray="3 24"/>
  <circle cx="256" cy="255" r="128" fill="none" stroke="#7fae6a" stroke-opacity="0.12" stroke-width="5" stroke-dasharray="2 17"/>
  <!-- silvermoon halo behind the head -->
  <path d="M 228 142 A 46 46 0 0 1 298 138" fill="none" stroke="#b8c4de" stroke-opacity="0.3" stroke-width="5"/>
  <!-- wind streaks lifting the cloak -->
  <g fill="none" stroke="#7fae6a" stroke-opacity="0.22" stroke-width="2.5" stroke-linecap="round">
    <path d="M 402 178 L 470 172"/>
    <path d="M 424 208 L 488 204"/>
    <path d="M 440 148 L 496 144"/>
  </g>
  <!-- drifting motes -->
  <g fill="#7fae6a">
    <circle cx="92" cy="64" r="3" fill-opacity="0.35"/>
    <circle cx="418" cy="92" r="2.4" fill-opacity="0.3"/>
    <circle cx="452" cy="180" r="3.2" fill-opacity="0.25"/>
    <circle cx="70" cy="330" r="2.6" fill-opacity="0.3"/>
    <circle cx="392" cy="52" r="2" fill-opacity="0.4"/>
    <circle cx="30" cy="220" r="2" fill-opacity="0.25"/>
    <circle cx="474" cy="270" r="2.2" fill-opacity="0.3"/>
    <circle cx="140" cy="44" r="2" fill-opacity="0.3"/>
    <circle cx="252" cy="26" r="1.8" fill-opacity="0.35"/>
    <circle cx="436" cy="414" r="2.4" fill-opacity="0.22"/>
    <circle cx="56" cy="148" r="1.8" fill-opacity="0.3"/>
    <circle cx="348" cy="302" r="2" fill-opacity="0.18"/>
  </g>
  <ellipse cx="256" cy="480" rx="210" ry="18" fill="#0d0a07"/>

  <!-- ============ ground mist ============ -->
  <path d="M 40 476 C 84 452 122 468 162 458 C 204 448 236 466 278 456 C 320 446 358 464 398 454 C 436 444 466 462 496 456 L 496 512 L 40 512 Z"
        fill="#0d0a07" fill-opacity="0.45"/>
  <path d="M 70 490 C 112 476 146 488 186 482 C 228 474 258 486 300 480 C 342 472 378 486 416 480 C 448 473 472 484 492 480 L 492 512 L 70 512 Z"
        fill="#241a10" fill-opacity="0.4"/>

  <g fill="#0a0a0a" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">

    <!-- ================= CLOAK (lifting in wind, behind) ================= -->
    <path stroke="none" d="M 292 200
             C 340 188, 396 204, 430 240
             C 452 264, 458 300, 448 336
             C 438 320, 424 314, 414 318
             C 424 346, 416 376, 396 392
             C 388 378, 376 372, 366 376
             C 372 394, 360 408, 342 412
             C 348 356, 330 280, 292 200 Z"/>
    <!-- cloak clasp at the throat -->
    <circle cx="290" cy="202" r="9" stroke="none"/>
    <path stroke="none" d="M 296 194 L 310 184 L 302 200 Z"/>

    <!-- ================= HAIR (streaming behind in wind) ================= -->
    <path stroke="none" d="M 260 136
             C 284 124, 312 130, 332 144
             C 348 156, 356 170, 352 182
             C 344 172, 332 164, 320 162
             C 334 174, 342 186, 340 198
             C 328 188, 314 182, 302 182
             C 312 192, 316 202, 312 210
             C 304 200, 292 192, 282 190 Z"/>

    <!-- ================= QUIVER (on the back) ================= -->
    <g transform="translate(330 258) rotate(15)" stroke="none">
      <rect x="-15" y="-56" width="30" height="106" rx="13"/>
      <rect x="-18" y="-58" width="36" height="12" rx="6"/>
      <rect x="-18" y="34" width="36" height="10" rx="5"/>
    </g>
    <!-- fletchings rising over the shoulder -->
    <path stroke="none" d="M 334 200 L 340 170 L 348 196 Z"/>
    <path stroke="none" d="M 344 196 L 354 164 L 360 192 Z"/>
    <path stroke="none" d="M 356 200 L 368 176 L 370 200 Z"/>

    <!-- ================= LONGBOW (drawn) ================= -->
    <path stroke-width="9" fill="none" d="M 164 112 C 146 152, 140 190, 140 230 C 140 270, 146 308, 164 348"/>
    <!-- grip bulge + nock flares -->
    <circle cx="141" cy="230" r="11" stroke="none"/>
    <path stroke="none" d="M 164 112 L 172 104 L 168 120 Z"/>
    <path stroke="none" d="M 164 348 L 172 356 L 168 340 Z"/>
    <!-- drawn string: tips to the anchor at the ear -->
    <path stroke-width="3.5" fill="none" d="M 164 112 L 288 170 L 164 348"/>

    <!-- ================= ARROW ================= -->
    <path stroke-width="4.5" fill="none" d="M 290 168 L 104 187"/>
    <!-- head -->
    <path stroke="none" d="M 106 180 L 86 189 L 107 194 Z"/>
    <!-- fletching at the shaft nock -->
    <path stroke="none" d="M 268 166 L 292 158 L 288 172 Z"/>
    <path stroke="none" d="M 270 176 L 292 180 L 272 182 Z"/>

    <!-- ================= BOW ARM (extended forward) ================= -->
    <!-- shoulder (248,208) elbow (202,216) hand (146,228) -->
    <path stroke-width="14" fill="none" d="M 248 208 L 202 216 L 150 227"/>
    <!-- bracer -->
    <path stroke-width="20" fill="none" d="M 182 219 L 158 225"/>
    <circle cx="186" cy="212" r="3.5" stroke="none"/>
    <circle cx="168" cy="216" r="3.5" stroke="none"/>
    <!-- gripping hand -->
    <circle cx="146" cy="228" r="9" stroke="none"/>

    <!-- ================= TRAILING / DRAW ARM (to full anchor) ================= -->
    <!-- shoulder (272,208) high elbow (310,166) hook hand (286,171) -->
    <path stroke-width="14" fill="none" d="M 272 208 L 310 166 L 288 171"/>
    <!-- bracer on the forearm -->
    <path stroke-width="19" fill="none" d="M 304 170 L 294 172"/>
    <circle cx="306" cy="161" r="3.5" stroke="none"/>
    <!-- hooked finger tab at the anchor -->
    <circle cx="284" cy="172" r="8" stroke="none"/>
    <path stroke="none" d="M 278 166 L 270 162 L 278 160 Z"/>

    <!-- ================= TORSO (lithe, leaning into the draw) ================= -->
    <path stroke="none" d="M 246 206
             C 258 196, 284 196, 294 208
             C 302 220, 300 244, 296 264
             C 292 284, 286 296, 278 302
             C 264 308, 250 306, 244 298
             C 238 284, 236 254, 240 230
             C 241 218, 243 210, 246 206 Z"/>
    <!-- quiver strap across the chest -->
    <path stroke-width="8" fill="none" d="M 248 216 C 266 236, 286 252, 306 262"/>

    <!-- ================= HEAD (profile, facing left) ================= -->
    <ellipse cx="262" cy="162" rx="20" ry="22" stroke="none"/>
    <rect x="252" y="176" width="22" height="26" stroke="none"/>
    <!-- face profile: brow, pointed nose, lips, chin -->
    <path stroke="none" d="M 250 148
             C 240 154, 234 162, 229 171
             L 238 176 L 234 181
             C 236 188, 244 194, 254 194
             L 258 150 Z"/>
    <!-- long pointed ear -->
    <path stroke="none" d="M 270 154 C 282 142, 296 128, 306 116 C 302 134, 294 150, 282 164 Z"/>
    <!-- circlet with gem over the brow -->
    <path stroke-width="4" fill="none" d="M 242 152 C 252 145, 270 145, 282 152"/>
    <circle cx="243" cy="152" r="4" stroke="none"/>

    <!-- ================= BELT + hip kit ================= -->
    <path stroke="none" d="M 240 296 C 254 306, 280 306, 292 298 L 296 314 C 280 324, 252 324, 236 312 Z"/>
    <circle cx="266" cy="310" r="6" stroke="none"/>
    <circle cx="244" cy="308" r="3" stroke="none"/>
    <circle cx="288" cy="306" r="3" stroke="none"/>
    <!-- small hip pouch, front -->
    <path stroke="none" d="M 234 314 L 252 318 L 250 336 C 248 344, 236 344, 232 336 Z"/>
    <!-- skinning knife on the rear hip -->
    <path stroke="none" d="M 292 312 L 300 314 L 296 334 L 292 334 Z"/>
    <path stroke="none" d="M 290 310 L 302 312 L 301 318 L 289 316 Z"/>

    <!-- ================= LEATHER SKIRT FLAPS ================= -->
    <path stroke="none" d="M 240 314 C 236 336, 234 352, 236 368 L 256 372 C 256 352, 256 332, 254 316 Z"/>
    <path stroke="none" d="M 262 316 C 264 336, 268 352, 272 366 L 292 360 C 288 344, 284 328, 282 312 Z"/>

    <!-- ================= LEGS (mid-stride) ================= -->
    <!-- forward leg: hip (254,300) knee bent (222,358) ankle (210,450) -->
    <path stroke-width="17" fill="none" d="M 254 300 L 222 358 L 210 448"/>
    <!-- trailing leg: hip (278,298) knee (300,368) ankle (326,448) -->
    <path stroke-width="16" fill="none" d="M 278 298 L 300 368 L 326 448"/>
    <!-- knee wraps -->
    <circle cx="222" cy="358" r="10" stroke="none"/>
    <path stroke-width="14" fill="none" d="M 214 350 L 232 366"/>
    <circle cx="300" cy="368" r="9" stroke="none"/>
    <path stroke-width="13" fill="none" d="M 292 362 L 310 374"/>
    <!-- boot cuffs -->
    <ellipse cx="210" cy="440" rx="17" ry="8" transform="rotate(-8 210 440)" stroke="none"/>
    <ellipse cx="326" cy="440" rx="16" ry="8" transform="rotate(10 326 440)" stroke="none"/>
    <!-- forward boot -->
    <path stroke="none" d="M 196 452
             C 184 458, 172 468, 168 476
             C 165 482, 172 486, 184 486
             L 226 486
             C 234 486, 236 479, 232 472
             C 226 462, 218 456, 210 452
             C 205 450, 200 450, 196 452 Z"/>
    <!-- trailing boot, heel lifted -->
    <path stroke="none" d="M 316 450
             C 306 456, 298 466, 296 474
             C 295 481, 302 485, 314 485
             L 342 485
             C 350 485, 352 479, 348 471
             C 342 461, 334 453, 326 449
             C 322 448, 319 448, 316 450 Z"/>
  </g>

  <!-- ============ interior jade etching ============ -->
  <g fill="none" stroke="#7fae6a" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <!-- bow: back-of-limb line + grip wraps -->
    <path d="M 168 128 C 152 164, 147 200, 147 232 C 147 266, 152 302, 168 336"/>
    <path d="M 133 220 L 149 222"/>
    <path d="M 133 230 L 149 232"/>
    <path d="M 133 240 L 149 242"/>
    <!-- arrow shaft wrap -->
    <path d="M 250 170 L 252 178"/>
    <path d="M 200 175 L 202 183"/>
    <!-- fletching notches -->
    <path d="M 274 166 L 284 163"/>
    <path d="M 276 177 L 286 179"/>
    <!-- quiver: seam + bands -->
    <g transform="translate(330 258) rotate(15)">
      <path d="M 0 -42 L 0 30"/>
      <path d="M -12 -30 L 12 -30"/>
      <path d="M -12 18 L 12 18"/>
    </g>
    <!-- hair strand sweeps -->
    <path d="M 272 140 C 294 136, 316 144, 332 156"/>
    <path d="M 280 150 C 300 152, 318 162, 330 174"/>
    <path d="M 286 162 C 300 170, 312 180, 318 192"/>
    <!-- cloak fold sweeps -->
    <path d="M 310 216 C 336 254, 352 314, 350 384" stroke-opacity="0.35"/>
    <path d="M 340 214 C 368 248, 386 300, 382 366" stroke-opacity="0.35"/>
    <path d="M 372 228 C 398 258, 412 300, 406 344" stroke-opacity="0.3"/>
    <!-- brow circlet + jawline -->
    <path d="M 246 150 C 256 146, 270 146, 280 152"/>
    <path d="M 254 190 C 262 192, 268 190, 272 186"/>
    <!-- chest: harness seam + tattoo swirl -->
    <path d="M 250 232 C 264 240, 280 240, 292 232"/>
    <path d="M 256 258 C 266 252, 276 252, 284 258"/>
    <!-- belt edge -->
    <path d="M 242 304 C 256 312, 278 312, 290 304"/>
    <!-- tattoo swirls: bow arm + legs -->
    <path d="M 196 210 C 210 206, 224 206, 236 210"/>
    <path d="M 232 336 C 224 348, 220 360, 222 372"/>
    <path d="M 296 344 C 302 354, 306 364, 306 376"/>
    <!-- skirt flap seams -->
    <path d="M 246 320 C 244 340, 243 356, 245 368"/>
    <path d="M 274 320 C 276 338, 280 352, 283 362"/>
    <!-- boot cuff lines -->
    <path d="M 196 442 L 224 440"/>
    <path d="M 312 440 L 340 442"/>
  </g>

  <!-- ============ glow accents ============ -->
  <g fill="none" stroke="#a3d98c" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
    <!-- bow belly edges -->
    <path d="M 158 128 C 145 162, 138 196, 138 226"/>
    <path d="M 138 238 C 138 268, 145 302, 158 332"/>
    <!-- bow nock tips -->
    <path d="M 168 106 L 171 102"/>
    <path d="M 168 354 L 171 358"/>
    <!-- halo arc -->
    <path d="M 234 136 A 42 42 0 0 1 294 134" stroke-opacity="0.35"/>
    <!-- ear rim -->
    <path d="M 272 150 C 284 138, 296 126, 304 116" stroke-opacity="0.45"/>
    <!-- hair tail edge -->
    <path d="M 334 148 C 348 160, 354 172, 351 182"/>
    <!-- cloak trailing edge -->
    <path d="M 428 236 C 450 262, 456 300, 446 336"/>
    <path d="M 414 318 C 422 344, 416 372, 398 390"/>
    <!-- boot toes -->
    <path d="M 170 474 C 174 481, 180 484, 188 486"/>
    <path d="M 298 472 C 300 479, 306 483, 314 484"/>
    <!-- quiver top band -->
    <path d="M 322 198 L 344 194"/>
  </g>

  <!-- circlet gem glow -->
  <g fill="none" stroke="#bdf0a4" stroke-opacity="0.5" stroke-width="2">
    <circle cx="243" cy="152" r="6"/>
  </g>

  <!-- moon glint on the arrow point -->
  <g stroke="#d8f2c4" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round">
    <path d="M 82 176 L 92 175"/>
    <path d="M 87 170 L 87 180"/>
  </g>

  <!-- glowing Night Elf eye -->
  <g stroke="#d8f2c4" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 238 166 L 248 166"/>
  </g>
</svg>
