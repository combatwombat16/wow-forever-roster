<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/druid.svg — Tauren druid standing calm and rooted, antlered helm
  crowned high, gnarled living staff cradled in the left forepaw, right hand resting at
  the chest in a healing gesture, a faint translucent bear-spirit rising behind the
  shoulders. Same conventions as the roster files: solid #0a0a0a figure, warm layered
  backdrop, interior etching, glow accents — accents in amber gold (etching #cf9a52,
  glow #f0b45f, bright #ffd9a0) with leaf motifs; the bear spirit is drawn at low
  opacity behind the figure group.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Tauren Druid — Antlered Helm, Living Staff, Bear Spirit (WoW style silhouette)</title>

