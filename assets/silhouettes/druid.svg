  <circle cx="256" cy="255" r="198" fill="#2e2318"/>
  <circle cx="256" cy="255" r="152" fill="#3d2c1a"/>
  <!-- rune tick rings -->
  <circle cx="256" cy="255" r="176" fill="none" stroke="#cf9a52" stroke-opacity="0.16" stroke-width="7" stroke-dasharray="3 24"/>
  <circle cx="256" cy="255" r="128" fill="none" stroke="#cf9a52" stroke-opacity="0.10" stroke-width="5" stroke-dasharray="2 17"/>
