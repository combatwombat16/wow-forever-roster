  <g fill="#c9a24a">
    <circle cx="92" cy="64" r="3" fill-opacity="0.35"/>
    <circle cx="418" cy="92" r="2.4" fill-opacity="0.3"/>
    <circle cx="452" cy="180" r="3.2" fill-opacity="0.25"/>
    <circle cx="70" cy="330" r="2.6" fill-opacity="0.3"/>
    <circle cx="392" cy="52" r="2" fill-opacity="0.4"/>
    <circle cx="30" cy="220" r="2" fill-opacity="0.25"/>
    <circle cx="474" cy="270" r="2.2" fill-opacity="0.3"/>
    <circle cx="140" cy="44" r="2" fill-opacity="0.3"/>
    <circle cx="252" cy="26" r="1.8" fill-opacity="0.35"/>
    <circle cx="436" cy="414" r="2.4" fill-opacity="0.22"/>
    <circle cx="56" cy="148" r="1.8" fill-opacity="0.3"/>
    <circle cx="348" cy="302" r="2" fill-opacity="0.18"/>
  </g>
  <ellipse cx="256" cy="480" rx="210" ry="18" fill="#0d0a07"/>

  <!-- ============ serene mist behind the feet ============ -->
  <path d="M 40 476 C 84 452 122 468 162 458 C 204 448 236 466 278 456 C 320 446 358 464 398 454 C 436 444 466 462 496 456 L 496 512 L 40 512 Z"
        fill="#0d0a07" fill-opacity="0.45"/>
  <path d="M 70 490 C 112 476 146 488 186 482 C 228 474 258 486 300 480 C 342 472 378 486 416 480 C 448 473 472 484 492 480 L 492 512 L 70 512 Z"
        fill="#241a10" fill-opacity="0.4"/>

  <g fill="#0a0a0a" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">

    <!-- ================= WAR HAMMER (raised in benediction, vertical at right) ================= -->
    <g transform="translate(340 120)" stroke="none">
      <!-- haft, resting down onto the right pauldron -->
      <rect x="-7" y="-24" width="14" height="116" rx="6"/>
      <!-- leather grip wrap bulge at the fist -->
      <rect x="-11" y="-16" width="22" height="30" rx="10"/>
      <!-- pommel diamond -->
      <path d="M 0 86 L 11 98 L 0 112 L -11 98 Z"/>
      <!-- hammer head: collar, block, top flange -->
      <rect x="-28" y="-32" width="56" height="12" rx="5"/>
      <rect x="-38" y="-78" width="76" height="52" rx="8"/>
      <rect x="-31" y="-88" width="62" height="14" rx="5"/>
      <!-- side flanges (war-hammer wings) -->
      <path d="M -38 -74 L -58 -66 L -58 -40 L -38 -32 Z"/>
      <path d="M 38 -74 L 58 -66 L 58 -40 L 38 -32 Z"/>
      <!-- crown finial -->
      <path d="M -8 -88 L 0 -102 L 8 -88 Z"/>
    </g>

    <!-- ================= LEFT ARM (shield side) ================= -->
    <!-- shoulder (206,218) elbow (186,258) fist (158,296) -->
    <path d="M 206 218 L 186 258 L 160 294" stroke-width="24" fill="none"/>
    <!-- studded bracer -->
    <path d="M 178 272 L 168 288" stroke-width="30" fill="none"/>
    <circle cx="184" cy="264" r="4" stroke="none"/>
    <circle cx="176" cy="278" r="4" stroke="none"/>
