    <path d="M 234 320 Q 222 338 226 354" stroke-width="5" fill="none" stroke-dasharray="1.5 6"/>
    <path stroke="none" d="M 219 354 L 233 354 L 230 362 L 222 362 Z"/>
    <path stroke="none" d="M 224 362 L 228 362 L 228 378 L 224 378 Z"/>

    <!-- ================= TABARD (draping to the feet) ================= -->
    <path stroke="none" d="M 236 322
             C 232 370, 228 420, 226 452
             L 222 470 L 232 462 L 242 476 L 252 464 L 262 480
             L 272 464 L 282 476 L 292 462 L 300 470 L 296 452
             C 292 420, 288 370, 284 322 Z"/>

    <!-- ================= LEGS ================= -->
    <path d="M 240 315 L 230 446" stroke-width="32" fill="none"/>
    <path d="M 288 313 L 300 446" stroke-width="32" fill="none"/>
