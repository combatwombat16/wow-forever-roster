    <!-- left pauldron (shield side): three layered plates -->
    <path stroke="none" d="M 192 222 C 202 202, 228 194, 250 200 C 240 210, 236 220, 236 232 C 218 240, 200 236, 192 222 Z"/>
    <path stroke="none" d="M 186 208 C 198 190, 224 182, 246 188 C 238 196, 234 202, 232 208 C 216 214, 196 216, 186 208 Z"/>
    <path stroke="none" d="M 184 194 C 196 178, 222 172, 242 178 C 236 184, 232 188, 230 194 C 214 200, 194 202, 184 194 Z"/>
    <!-- left wing rising off the pauldron -->
