    <path d="M 350 158 L 346 136" stroke-width="30" fill="none"/>
    <circle cx="357" cy="156" r="4" stroke="none"/>
    <circle cx="355" cy="142" r="4" stroke="none"/>
    <!-- gauntlet fist gripping the haft -->
    <circle cx="342" cy="120" r="17" stroke="none"/>
    <circle cx="342" cy="120" r="14"/>

    <!-- ================= KITE SHIELD (planted, tip grounded) ================= -->
    <path stroke="none" d="M 148 230
             L 198 258
             C 202 322, 186 394, 148 482
             C 110 394, 94 322, 98 258 Z"/>
    <!-- shield top finial -->
    <circle cx="148" cy="226" r="6" stroke="none"/>
    <path stroke="none" d="M 148 210 L 154 222 L 142 222 Z"/>
    <!-- shield boss over the grip -->
    <circle cx="152" cy="298" r="18" stroke="none"/>
    <path stroke="none" d="M 152 274 L 156 286 L 148 286 Z"/>
    <!-- rim rivets -->
    <circle cx="106" cy="272" r="4" stroke="none"/>
    <circle cx="190" cy="272" r="4" stroke="none"/>
    <circle cx="112" cy="360" r="4" stroke="none"/>
    <circle cx="184" cy="360" r="4" stroke="none"/>

    <!-- ================= TORSO (heavy plate) ================= -->
    <path stroke="none" d="M 226 208
             C 240 192, 288 192, 306 204
             C 320 216, 322 240, 318 262
             C 314 282, 304 296, 292 302
             C 268 312, 240 310, 230 300
             C 222 284, 220 254, 222 232
