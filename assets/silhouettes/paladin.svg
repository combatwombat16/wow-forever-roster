    <path stroke="none" d="M 258 140 C 252 122, 260 106, 278 100 C 270 116, 272 130, 282 138 C 272 142, 264 142, 258 140 Z"/>
    <circle cx="265" cy="122" r="5" stroke="none"/>
    <circle cx="273" cy="108" r="4" stroke="none"/>
    <!-- helmet side wings -->
    <path stroke="none" d="M 246 160 C 234 154, 228 144, 228 134 C 238 142, 246 146, 254 148 C 250 152, 248 156, 246 160 Z"/>
    <path stroke="none" d="M 290 156 C 300 150, 306 142, 307 132 C 298 140, 290 143, 283 145 C 287 149, 289 152, 290 156 Z"/>
    <!-- aventail / neck chain -->
    <path stroke="none" d="M 250 180 C 248 192, 252 200, 258 204 L 280 204 C 286 200, 290 192, 288 180 C 276 188, 262 188, 250 180 Z"/>

    <!-- ================= BELT: studded strap + hammer buckle ================= -->
    <path stroke="none" d="M 228 298 C 250 310, 282 310, 298 300 L 302 320 C 282 332, 250 332, 224 320 Z"/>
    <circle cx="234" cy="312" r="4" stroke="none"/>
    <circle cx="294" cy="312" r="4" stroke="none"/>
    <!-- square buckle plate -->
    <rect x="250" y="302" width="28" height="22" rx="4" stroke="none"/>
