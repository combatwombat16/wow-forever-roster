             C 334 478, 326 484, 312 484
             L 276 484
             C 268 484, 266 476, 270 468
             C 276 458, 284 450, 292 446
             C 294 446, 295 447, 296 448 Z"/>
  </g>

  <!-- ============ interior gold etching ============ -->
  <g fill="none" stroke="#c9a24a" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
