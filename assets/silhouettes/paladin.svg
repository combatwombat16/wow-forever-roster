    <ellipse cx="230" cy="442" rx="24" ry="11" stroke="none"/>
    <ellipse cx="300" cy="442" rx="24" ry="11" stroke="none"/>
    <!-- left boot -->
    <path stroke="none" d="M 216 448
             C 202 454, 190 464, 186 472
             C 182 480, 190 486, 204 486
             L 248 486
             C 256 486, 258 478, 254 470
             C 248 460, 240 452, 232 448
             C 226 446, 220 446, 216 448 Z"/>
    <!-- right boot -->
