    <circle cx="236" cy="392" r="14" stroke="none"/>
    <path stroke="none" d="M 224 384 L 206 372 L 222 398 Z"/>
    <circle cx="296" cy="390" r="14" stroke="none"/>
    <path stroke="none" d="M 308 382 L 326 370 L 310 396 Z"/>
