      <path d="M -4 -2 L 4 -2"/>
    </g>
    <g transform="translate(340 180)">
      <path d="M 0 -5 L 0 5"/>
      <path d="M -4 -2 L 4 -2"/>
    </g>
  </g>

  <!-- tabard emblem glow -->
  <g fill="none" stroke="#eec25c" stroke-opacity="0.4" stroke-width="1.5">
    <circle cx="260" cy="372" r="14"/>
  </g>

  <!-- glint on the hammer crown -->
  <g stroke="#f5d072" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round">
    <path d="M 364 36 L 376 36"/>
    <path d="M 370 30 L 370 42"/>
  </g>
  <!-- glint on the shield tip -->
  <g stroke="#f5d072" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
    <path d="M 142 476 L 152 476"/>
    <path d="M 147 471 L 147 481"/>
  </g>
  <!-- glowing visor slits -->
  <g stroke="#f5d072" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" fill="none">
