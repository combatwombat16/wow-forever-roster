<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/paladin.svg — Human paladin in heavy plate, solemn guardianship stance.
  Tall kite shield planted at the left side (tip grounded), war hammer raised overhead in
  benediction in the right hand, tabard draping from the belt to the feet, winged pauldrons,
  crested helmet, classic WoW style. Built in the same conventions as warrior.svg:
  solid #0a0a0a figure, warm layered backdrop, gold interior etching, holy glow accents.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Human Paladin — Planted Kite Shield, Hammer Raised in Benediction (WoW style silhouette)</title>

  <!-- ============ backdrop ============ -->
  <rect width="512" height="512" fill="#1a1410"/>
  <circle cx="256" cy="255" r="198" fill="#2e2318"/>
  <circle cx="256" cy="255" r="152" fill="#3d2c1a"/>
  <!-- rune tick rings -->
  <circle cx="256" cy="255" r="176" fill="none" stroke="#c9a24a" stroke-opacity="0.18" stroke-width="7" stroke-dasharray="3 24"/>
  <circle cx="256" cy="255" r="128" fill="none" stroke="#c9a24a" stroke-opacity="0.12" stroke-width="5" stroke-dasharray="2 17"/>
  <!-- benediction light rays falling from the raised hammer -->
  <g fill="#e8c060" fill-opacity="0.07">
    <path d="M 336 56 L 236 268 L 296 278 Z"/>
    <path d="M 344 56 L 448 260 L 388 276 Z"/>
  </g>
  <!-- faint halo behind the head -->
  <circle cx="268" cy="164" r="46" fill="none" stroke="#eec25c" stroke-opacity="0.14" stroke-width="5"/>
