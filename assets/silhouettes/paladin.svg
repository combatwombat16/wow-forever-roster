    <g transform="translate(340 120)">
      <path d="M 0 -70 L 0 -36"/>
      <path d="M -16 -58 L 16 -58"/>
      <path d="M -30 -62 L -30 -42"/>
      <path d="M 30 -62 L 30 -42"/>
      <path d="M -5 -6 L 5 -6"/>
      <path d="M -5 2 L 5 2"/>
      <path d="M -5 -14 L 5 -14"/>
      <path d="M 0 20 L 0 78"/>
    </g>
    <!-- shield: inner rim band -->
    <path d="M 148 246 L 186 268 C 189 324, 176 388, 148 456 C 120 388, 107 324, 110 268 Z"/>
    <!-- shield: blessing cross below the boss -->
    <path d="M 148 322 L 148 408"/>
    <path d="M 124 348 L 172 348"/>
    <!-- boss ring -->
    <circle cx="152" cy="298" r="10"/>
    <!-- breastplate seams and V -->
    <path d="M 232 242 C 254 252, 284 252, 306 242"/>
    <path d="M 240 216 L 266 238 L 292 216"/>
    <!-- gorget seam -->
    <path d="M 242 205 C 256 213, 282 213, 296 205"/>
    <!-- pauldron plate seams -->
    <path d="M 190 210 C 202 196, 224 190, 244 194"/>
    <path d="M 186 196 C 198 184, 218 178, 238 182"/>
    <path d="M 314 216 C 324 204, 342 198, 356 202"/>
    <!-- wing feather lines -->
    <path d="M 206 172 C 202 160, 204 148, 210 140"/>
    <path d="M 342 182 C 348 172, 356 166, 362 162"/>
    <!-- helmet brow and nasal -->
    <path d="M 250 158 C 258 150, 280 148, 288 156"/>
    <path d="M 268 158 L 268 182"/>
    <!-- belt edge -->
    <path d="M 230 306 C 252 318, 280 318, 296 308"/>
    <!-- buckle cross -->
    <path d="M 264 306 L 264 320"/>
    <path d="M 257 312 L 271 312"/>
    <!-- tabard trim lines -->
    <path d="M 244 332 C 240 380, 236 428, 234 456"/>
    <path d="M 276 332 C 280 380, 284 428, 286 456"/>
    <!-- tabard hem zigzag echo -->
    <path d="M 230 458 L 240 468 L 250 456 L 260 470 L 270 456 L 280 468 L 290 458"/>
    <!-- greave seams -->
    <path d="M 238 356 L 230 434"/>
    <path d="M 292 354 L 300 434"/>
  </g>

  <!-- tabard emblem: sun disc with cross -->
  <g fill="none" stroke="#c9a24a" stroke-opacity="0.5" stroke-width="2">
    <circle cx="260" cy="372" r="11"/>
    <path d="M 260 364 L 260 380"/>
    <path d="M 252 372 L 268 372"/>
  </g>

  <!-- ============ holy glow accents ============ -->
  <g fill="none" stroke="#eec25c" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
    <!-- hammer head edges -->
    <path d="M 308 42 L 372 42"/>                    <!-- top flange -->
    <path d="M 282 54 L 282 80"/>                    <!-- left flange -->
    <path d="M 398 54 L 398 80"/>                    <!-- right flange -->
    <path d="M 340 18 L 340 30"/>                    <!-- crown finial -->
    <!-- shield outer rim, left edge to planted tip -->
    <path d="M 100 262 C 97 322, 112 394, 144 468"/>
    <!-- shield top finial -->
    <path d="M 148 212 L 148 218"/>
    <!-- halo arc above the helm -->
    <path d="M 236 150 A 44 44 0 0 1 300 150" stroke-opacity="0.35"/>
    <!-- helmet crest -->
    <path d="M 260 136 C 254 120, 262 106, 276 102"/>
    <!-- left pauldron crest + wing tip -->
    <path d="M 192 212 C 202 194, 226 186, 246 190"/>
    <path d="M 202 136 L 204 130"/>
    <!-- boot toes -->
    <path d="M 188 470 C 194 478, 200 482, 208 484"/>
    <path d="M 328 468 C 332 474, 330 480, 322 483"/>
