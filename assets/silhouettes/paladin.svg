    <circle cx="192" cy="204" r="4" stroke="none"/>
    <circle cx="208" cy="194" r="4" stroke="none"/>
    <circle cx="228" cy="188" r="4" stroke="none"/>
    <!-- right pauldron (hammer side): two plates + wing -->
    <path stroke="none" d="M 310 226 C 318 208, 340 200, 358 206 C 354 214, 352 222, 354 230 C 338 238, 318 236, 310 226 Z"/>
    <path stroke="none" d="M 314 210 C 322 194, 344 188, 360 192 C 356 198, 354 202, 354 208 C 340 214, 322 216, 314 210 Z"/>
    <path stroke="none" d="M 336 188 C 342 172, 354 162, 368 158 C 360 168, 358 178, 360 186 C 352 190, 342 190, 336 188 Z"/>
    <circle cx="320" cy="222" r="3.5" stroke="none"/>
    <circle cx="338" cy="212" r="3.5" stroke="none"/>

    <!-- ================= HEAD (crested helmet) ================= -->
