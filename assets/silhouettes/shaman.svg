<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/shaman.svg — Orc shaman standing squared and grounded, both arms
  outstretched, two totems: a double-headed totem staff planted before the left foot and
  a horned-skull ground totem with an elemental flame at the right foot (lightning
  channeled into it from the right hand), lightning-rod crests rising off the pauldrons,
  head in profile mass with upswept tusks and a segmented braided beard, earth-elemental
  motes hovering at the feet. Same conventions as the other roster files: solid #0a0a0a
  figure, warm layered backdrop, interior etching, glow accents — accents in spirit-blue
  (etching #5a8fc0, glow #7fb2e8, bright #c0dcf5).
-->
