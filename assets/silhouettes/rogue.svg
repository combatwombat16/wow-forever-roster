<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/silhouettes/rogue.svg — Human rogue crouched in a stalking half-turn, twin daggers
  low in reverse grip at the hips, hood drawn forward over the face, body angled as if
  emerging from shadow. Built in the same conventions as warrior.svg / paladin.svg /
  hunter.svg: solid #0a0a0a figure, warm layered backdrop, interior etching, glow accents
  — accents shifted to muted violet, with a jagged shadow veil creeping in from the left.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Human Rogue — Crouched Stalk, Twin Reverse-Grip Daggers (WoW style silhouette)</title>

  <!-- ============ backdrop ============ -->
  <rect width="512" height="512" fill="#1a1410"/>
  <circle cx="256" cy="255" r="198" fill="#2e2318"/>
  <circle cx="256" cy="255" r="152" fill="#3d2c1a"/>
  <!-- rune tick rings -->
  <circle cx="256" cy="255" r="176" fill="none" stroke="#8fa3b8" stroke-opacity="0.16" stroke-width="7" stroke-dasharray="3 24"/>
  <circle cx="256" cy="255" r="128" fill="none" stroke="#8fa3b8" stroke-opacity="0.10" stroke-width="5" stroke-dasharray="2 17"/>
  <!-- the shadow the rogue is emerging from: jagged veil, lower left -->
  <path d="M 0 512 L 0 268 L 34 300 L 58 258 L 92 306 L 118 268 L 150 318
           L 178 296 L 204 344 L 226 400 L 236 512 Z"
        fill="#0d0a07" fill-opacity="0.55"/>
  <path d="M 0 512 L 0 356 L 30 380 L 52 348 L 84 392 L 112 366 L 140 408
           L 168 392 L 190 432 L 202 512 Z"
        fill="#0a0a0a" fill-opacity="0.65"/>
  <!-- shadow wisps peeling off the veil -->
  <g fill="#0d0a07" fill-opacity="0.5">
    <path d="M 150 322 C 176 310, 200 314, 216 328 C 196 326, 176 328, 162 336 Z"/>
    <path d="M 118 276 C 140 262, 162 264, 176 276 C 158 274, 142 278, 130 286 Z"/>
    <path d="M 196 404 C 224 394, 246 398, 258 410 C 238 408, 220 410, 206 416 Z"/>
  </g>
  <!-- drifting motes -->
  <g fill="#8fa3b8">
    <circle cx="92" cy="64" r="3" fill-opacity="0.3"/>
    <circle cx="418" cy="92" r="2.4" fill-opacity="0.3"/>
    <circle cx="452" cy="180" r="3.2" fill-opacity="0.25"/>
    <circle cx="70" cy="330" r="2.6" fill-opacity="0.22"/>
    <circle cx="392" cy="52" r="2" fill-opacity="0.4"/>
    <circle cx="30" cy="220" r="2" fill-opacity="0.2"/>
    <circle cx="474" cy="270" r="2.2" fill-opacity="0.3"/>
    <circle cx="140" cy="44" r="2" fill-opacity="0.3"/>
    <circle cx="252" cy="26" r="1.8" fill-opacity="0.35"/>
    <circle cx="436" cy="414" r="2.4" fill-opacity="0.22"/>
    <circle cx="56" cy="148" r="1.8" fill-opacity="0.25"/>
    <circle cx="348" cy="302" r="2" fill-opacity="0.18"/>
  </g>
  <ellipse cx="256" cy="480" rx="210" ry="18" fill="#0d0a07"/>

  <!-- ============ ground mist ============ -->
  <path d="M 40 476 C 84 452 122 468 162 458 C 204 448 236 466 278 456 C 320 446 358 464 398 454 C 436 444 466 462 496 456 L 496 512 L 40 512 Z"
        fill="#0d0a07" fill-opacity="0.45"/>
  <path d="M 70 490 C 112 476 146 488 186 482 C 228 474 258 486 300 480 C 342 472 378 486 416 480 C 448 473 472 484 492 480 L 492 512 L 70 512 Z"
        fill="#241a10" fill-opacity="0.4"/>

  <g fill="#0a0a0a" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">

    <!-- ================= SHORT MANTLE (drifting back, right) ================= -->
    <path stroke="none" d="M 292 216
             C 330 218, 356 244, 362 280
             C 366 306, 358 330, 344 344
             C 342 326, 334 316, 324 314
             C 328 336, 320 352, 306 358
             C 306 320, 300 260, 292 216 Z"/>
    <!-- mantle clasp: small skull-less ring at the right collar -->
    <circle cx="292" cy="220" r="8" stroke="none"/>
    <path stroke="none" d="M 298 212 L 312 206 L 304 220 Z"/>

    <!-- ================= HOOD (drawn forward over the face) ================= -->
    <!-- hood shell + forward bill -->
    <path stroke="none" d="M 226 202
             C 214 186, 216 164, 234 155
             C 256 145, 280 154, 286 174
             C 290 190, 288 202, 282 212
             L 256 218
             C 240 218, 232 212, 226 202 Z"/>
    <path stroke="none" d="M 220 176 L 198 166 L 210 184 L 222 192 Z"/>
    <!-- cowl point trailing at the nape -->
    <path stroke="none" d="M 282 188 C 296 194, 304 206, 302 218 C 292 210, 284 206, 278 206 Z"/>
    <!-- deep hood brim ridge around the face cavity -->
    <path stroke-width="6" fill="none" d="M 224 178 C 218 192, 224 206, 238 212"/>
    <!-- head inside the hood (fills the face cavity so the outline stays solid) -->
    <ellipse cx="244" cy="188" rx="18" ry="19" stroke="none"/>
    <rect x="242" y="200" width="24" height="22" stroke="none"/>

    <!-- ================= TORSO (hunched, half-turn to the left) ================= -->
    <path stroke="none" d="M 226 226
             C 240 208, 276 206, 292 218
             C 306 230, 308 254, 302 276
             C 296 298, 286 312, 274 318
             C 258 324, 242 320, 236 310
             C 228 294, 224 264, 224 246
             C 224 236, 224 230, 226 226 Z"/>
    <!-- hunched shoulder epaulet, right -->
    <path stroke="none" d="M 288 226 C 298 214, 316 212, 326 220 C 320 226, 318 232, 318 240 C 306 244, 294 238, 288 226 Z"/>
    <path stroke="none" d="M 316 214 L 330 204 L 324 218 Z"/>

    <!-- ================= ARMS (held low, elbows pinned in) ================= -->
    <!-- left arm: shoulder (234,236) elbow (214,286) hand (212,338) -->
    <path stroke-width="13" fill="none" d="M 234 236 L 214 286 L 212 336"/>
    <!-- wrapped left forearm -->
    <path stroke-width="18" fill="none" d="M 216 296 L 213 326"/>
    <circle cx="212" cy="340" r="8" stroke="none"/>
    <!-- right arm: shoulder (292,238) elbow (316,288) hand (316,340) -->
    <path stroke-width="13" fill="none" d="M 292 238 L 316 288 L 316 338"/>
    <!-- wrapped right forearm -->
    <path stroke-width="18" fill="none" d="M 315 298 L 316 328"/>
    <circle cx="316" cy="342" r="8" stroke="none"/>

    <!-- ================= TWIN DAGGERS (reverse grip, blades down) ================= -->
    <!-- left dagger: spiked pommel, wrapped grip, swept quillons, wide bellied blade -->
    <circle cx="212" cy="327" r="6" stroke="none"/>
    <path stroke="none" d="M 209 322 L 212 312 L 215 322 Z"/>
    <rect x="205" y="330" width="14" height="18" rx="6" stroke="none"/>
    <path stroke-width="6" fill="none" d="M 197 352 C 205 345, 221 345, 228 353"/>
    <path stroke="none" d="M 200 354 L 222 352 C 217 376, 211 394, 203 410 C 199 394, 198 372, 200 354 Z"/>
    <!-- right dagger -->
    <circle cx="316" cy="329" r="6" stroke="none"/>
    <path stroke="none" d="M 313 324 L 316 314 L 319 324 Z"/>
    <rect x="309" y="332" width="14" height="18" rx="6" stroke="none"/>
    <path stroke-width="6" fill="none" d="M 302 354 C 309 346, 325 346, 332 355"/>
    <path stroke="none" d="M 304 356 L 326 358 C 327 378, 326 396, 323 414 C 314 396, 307 376, 304 356 Z"/>

    <!-- ================= BELT: low slung + pouches + sash ================= -->
    <path stroke="none" d="M 234 306 C 250 318, 280 318, 296 308 L 300 326 C 282 338, 250 338, 230 324 Z"/>
    <circle cx="266" cy="324" r="6" stroke="none"/>
    <circle cx="240" cy="318" r="3" stroke="none"/>
    <circle cx="292" cy="318" r="3" stroke="none"/>
    <!-- poison pouch + vial bump, left hip -->
    <path stroke="none" d="M 228 324 L 246 328 L 244 348 C 242 356, 230 356, 226 348 Z"/>
    <circle cx="236" cy="322" r="4" stroke="none"/>
    <!-- coin purse chain, right hip -->
    <path d="M 294 326 Q 306 342 302 356" stroke-width="4.5" fill="none" stroke-dasharray="1.5 6"/>
    <circle cx="302" cy="362" r="6" stroke="none"/>
    <!-- trailing sash, tucked at the right hip -->
    <path stroke="none" d="M 292 330
             C 308 348, 316 368, 312 392
             L 320 404 L 306 400 L 302 414 L 292 402
             C 296 378, 292 356, 282 340 Z"/>

    <!-- ================= LEGS (deep crouch, balls of the feet) ================= -->
    <!-- forward leg: hip (252,316) bent knee (196,372) ankle (196,452) -->
    <path stroke-width="16" fill="none" d="M 252 316 L 196 372 L 196 452"/>
    <!-- trailing leg: hip (278,316) knee (324,374) ankle (336,448) -->
    <path stroke-width="15" fill="none" d="M 278 316 L 324 374 L 336 448"/>
    <!-- knee pads -->
    <circle cx="196" cy="372" r="10" stroke="none"/>
    <path stroke-width="13" fill="none" d="M 188 364 L 206 380"/>
    <circle cx="324" cy="374" r="9" stroke="none"/>
    <path stroke-width="12" fill="none" d="M 316 368 L 334 380"/>
    <!-- soft boot cuffs -->
    <ellipse cx="196" cy="442" rx="16" ry="8" stroke="none"/>
    <ellipse cx="336" cy="440" rx="15" ry="7" transform="rotate(10 336 440)" stroke="none"/>
    <!-- forward boot, flat and silent -->
    <path stroke="none" d="M 182 454
             C 170 460, 160 470, 158 477
             C 156 483, 164 487, 176 487
             L 214 487
             C 222 487, 224 480, 220 473
             C 214 463, 206 457, 198 454
             C 192 452, 186 452, 182 454 Z"/>
    <!-- trailing boot, heel lifted on the ball of the foot -->
    <path stroke="none" d="M 328 452
             C 318 458, 310 468, 308 475
             C 307 481, 314 485, 326 485
             L 352 485
             C 360 485, 362 479, 358 471
             C 352 461, 344 455, 336 451
             C 333 450, 330 450, 328 452 Z"/>
  </g>

  <!-- ============ interior violet etching ============ -->
  <g fill="none" stroke="#8fa3b8" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <!-- hood: shell seam + bill edge + brim -->
    <path d="M 230 196 C 224 182, 228 166, 244 160"/>
    <path d="M 280 168 C 286 180, 286 196, 280 208"/>
    <path d="M 214 172 L 204 167"/>
    <!-- vest: V seam + stitching -->
    <path d="M 240 236 L 262 258 L 284 236"/>
    <path d="M 244 276 C 258 284, 276 284, 288 276"/>
    <path d="M 232 252 C 230 272, 232 292, 238 306"/>
    <!-- epaulet seam -->
    <path d="M 292 224 C 302 216, 316 216, 324 222"/>
    <!-- forearm wrap bands -->
    <path d="M 208 300 L 224 298"/>
    <path d="M 207 312 L 223 310"/>
    <path d="M 307 302 L 325 303"/>
    <path d="M 308 314 L 326 315"/>
    <!-- dagger fullers + grip wraps -->
    <path d="M 209 362 C 207 380, 205 394, 203 404"/>
    <path d="M 315 364 C 317 382, 319 396, 322 408"/>
    <path d="M 206 336 L 218 336"/>
    <path d="M 206 342 L 218 342"/>
    <path d="M 310 338 L 322 338"/>
    <path d="M 310 344 L 322 344"/>
    <!-- belt edge + buckle pin -->
    <path d="M 236 314 C 252 324, 280 324, 294 314"/>
    <path d="M 266 320 L 266 328"/>
    <!-- sash fold -->
    <path d="M 296 340 C 306 356, 310 374, 306 392"/>
    <!-- leg wrap bands -->
    <path d="M 190 400 L 206 398"/>
    <path d="M 190 414 L 204 412"/>
    <path d="M 322 400 L 338 402"/>
    <path d="M 324 414 L 340 416"/>
    <!-- mantle fold sweeps -->
    <path d="M 306 232 C 324 258, 336 296, 332 336" stroke-opacity="0.35"/>
    <path d="M 330 240 C 346 262, 352 292, 346 322" stroke-opacity="0.3"/>
  </g>

  <!-- ============ glow accents ============ -->
  <g fill="none" stroke="#a9bccf" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <!-- dagger cutting edges (belly curve to the point) -->
    <path d="M 200 360 C 199 378, 200 396, 203 408"/>
    <path d="M 327 362 C 327 380, 326 398, 323 412"/>
    <!-- pommel spikes -->
    <path d="M 212 318 L 212 313"/>
    <path d="M 316 320 L 316 315"/>
    <!-- hood bill + shell crest -->
    <path d="M 212 170 L 200 166"/>
    <path d="M 236 158 C 254 150, 274 154, 282 166"/>
    <!-- hunched shoulder crest -->
    <path d="M 290 224 C 300 214, 316 212, 326 218"/>
    <!-- boot toes -->
    <path d="M 160 476 C 164 482, 170 485, 178 487"/>
    <path d="M 310 474 C 312 480, 318 483, 326 485"/>
    <!-- mantle trailing edge -->
    <path d="M 356 254 C 364 276, 364 306, 350 336"/>
  </g>

  <!-- edge sheen strokes along the blades + diamond sparkles at the points -->
  <g stroke="#dce7f2" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round">
    <path d="M 204 392 L 209 378"/>
    <path d="M 320 394 L 316 380"/>
  </g>
  <g fill="#dce7f2" fill-opacity="0.9">
    <path d="M 202 402 L 206 410 L 202 420 L 198 410 Z"/>
    <path d="M 324 406 L 328 414 L 324 424 L 320 414 Z"/>
  </g>

  <!-- faint hooded eyes, deep in the cowl -->
  <g stroke="#dce7f2" stroke-opacity="0.65" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 224 188 L 232 190"/>
    <path d="M 240 186 L 246 187"/>
  </g>
</svg>
